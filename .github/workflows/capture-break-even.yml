name: Capture When portfolio evidence

on:
  push:
    paths:
      - .github/workflows/capture-break-even.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Capture live product screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p break-even
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/home.png https://break-even-beta.vercel.app/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/dating.png https://break-even-beta.vercel.app/dating
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/merch.png https://break-even-beta.vercel.app/merch
          file break-even/*.png

      - name: Add When to portfolio Lab
        run: python .github/scripts/insert_break_even.py

      - name: Validate and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s break-even/home.png
          test -s break-even/dating.png
          test -s break-even/merch.png
          grep -q 'href="break-even/index.html">Case study</a>' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html break-even/home.png break-even/dating.png break-even/merch.png
          git commit -m "feat: surface When? case study with live screenshots"
          git push
