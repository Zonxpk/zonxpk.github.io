name: Capture When portfolio evidence

on:
  push:
    paths:
      - .github/workflows/capture-break-even.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Capture live product screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p break-even
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/home.png https://break-even-beta.vercel.app/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/dating.png https://break-even-beta.vercel.app/dating
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/merch.png https://break-even-beta.vercel.app/merch
          file break-even/*.png

      - name: Add When to portfolio Lab
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if 'href="break-even/index.html">Case study</a>' in text:
              raise SystemExit("When? card already present")

          marker = '''            <div class="projects">
              <article class="proj">
                <div class="proj-meta reveal">
                  <span class="period mono">empeo</span>'''

          card = '''            <div class="projects">
              <article class="proj">
                <div class="proj-meta reveal">
                  <span class="period mono" style="color: var(--c-cyan)">2026 · product experiment</span>
                  <h3>When? / กี่โมง?</h3>
                  <p class="story">
                    A parody Thai super app engineered as a real cross-platform product:
                    food, dating, merch, vouchers, and partner campaigns share one
                    deterministic tracking-and-failure engine.
                  </p>
                  <dl class="proj-dl">
                    <div><dt>Kind</dt><dd>Full-stack product experiment</dd></div>
                    <div><dt>Focus</dt><dd>Reusable domain engine · cross-platform UI</dd></div>
                    <div><dt>Stack</dt><dd>Expo · React Native · Supabase</dd></div>
                  </dl>
                  <div class="proj-keys">
                    <a class="key" href="break-even/index.html">Case study</a>
                    <a class="key" href="https://break-even-beta.vercel.app" target="_blank" rel="noopener">Live app</a>
                  </div>
                </div>
                <div class="proj-screens">
                  <figure class="screen screen--phone reveal">
                    <div class="screen-top"><span class="mono">WHEN? · HOME</span><span class="plat">Expo</span><span class="led" aria-hidden="true"></span></div>
                    <div class="screen-body screen-body--frame"><img src="break-even/home.png" alt="When? Thai super app home screen" style="display:block;width:100%;height:auto" /></div>
                    <figcaption class="mono">parody super-app home · hand-drawn UI system</figcaption>
                  </figure>
                  <figure class="screen screen--phone reveal">
                    <div class="screen-top"><span class="mono">WHEN? · DATING</span><span class="plat">Expo</span><span class="led" aria-hidden="true"></span></div>
                    <div class="screen-body screen-body--frame"><img src="break-even/dating.png" alt="When? dating simulation screen" style="display:block;width:100%;height:auto" /></div>
                    <figcaption class="mono">dating domain · same shared failure lifecycle</figcaption>
                  </figure>
                  <figure class="screen screen--phone reveal">
                    <div class="screen-top"><span class="mono">WHEN? · MERCH</span><span class="plat">Expo</span><span class="led" aria-hidden="true"></span></div>
                    <div class="screen-body screen-body--frame"><img src="break-even/merch.png" alt="When? timed merch pop-up screen" style="display:block;width:100%;height:auto" /></div>
                    <figcaption class="mono">timed merch · voucher and redemption workflow</figcaption>
                  </figure>
                </div>
              </article>

              <article class="proj">
                <div class="proj-meta reveal">
                  <span class="period mono">empeo</span>'''

          if marker not in text:
              raise SystemExit("Lab insertion marker not found")
          path.write_text(text.replace(marker, card, 1), encoding="utf-8")

      - name: Validate and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s break-even/home.png
          test -s break-even/dating.png
          test -s break-even/merch.png
          grep -q 'href="break-even/index.html">Case study</a>' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html break-even/home.png break-even/dating.png break-even/merch.png
          git commit -m "feat: surface When? case study with live screenshots"
          git push
