name: Capture When portfolio evidence

on:
  push:
    paths:
      - .github/workflows/capture-break-even.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Capture live product screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p break-even
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/home.png https://break-even-beta.vercel.app/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/dating.png https://break-even-beta.vercel.app/dating
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=break-even/merch.png https://break-even-beta.vercel.app/merch
          file break-even/*.png

      - name: Add When to portfolio Lab
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if 'href="break-even/index.html">Case study</a>' in text:
              raise SystemExit("When? card already present")

          empeo = '<span class="period mono">empeo</span>'
          anchor = text.find(empeo)
          if anchor < 0:
              raise SystemExit("Lab project anchor not found")
          article = text.rfind('<article class="proj">', 0, anchor)
          if article < 0:
              raise SystemExit("Lab article anchor not found")

          indent = text[text.rfind('\n', 0, article) + 1:article]
          card = f'''<article class="proj">
{indent}  <div class="proj-meta reveal">
{indent}    <span class="period mono" style="color: var(--c-cyan)">2026 · product experiment</span>
{indent}    <h3>When? / กี่โมง?</h3>
{indent}    <p class="story">
{indent}      A parody Thai super app engineered as a real cross-platform product:
{indent}      food, dating, merch, vouchers, and partner campaigns share one
{indent}      deterministic tracking-and-failure engine.
{indent}    </p>
{indent}    <dl class="proj-dl">
{indent}      <div><dt>Kind</dt><dd>Full-stack product experiment</dd></div>
{indent}      <div><dt>Focus</dt><dd>Reusable domain engine · cross-platform UI</dd></div>
{indent}      <div><dt>Stack</dt><dd>Expo · React Native · Supabase</dd></div>
{indent}    </dl>
{indent}    <div class="proj-keys">
{indent}      <a class="key" href="break-even/index.html">Case study</a>
{indent}      <a class="key" href="https://break-even-beta.vercel.app" target="_blank" rel="noopener">Live app</a>
{indent}    </div>
{indent}  </div>
{indent}  <div class="proj-screens">
{indent}    <figure class="screen screen--phone reveal">
{indent}      <div class="screen-top"><span class="mono">WHEN? · HOME</span><span class="plat">Expo</span><span class="led" aria-hidden="true"></span></div>
{indent}      <div class="screen-body screen-body--frame"><img src="break-even/home.png" alt="When? Thai super app home screen" style="display:block;width:100%;height:auto" /></div>
{indent}      <figcaption class="mono">parody super-app home · hand-drawn UI system</figcaption>
{indent}    </figure>
{indent}    <figure class="screen screen--phone reveal">
{indent}      <div class="screen-top"><span class="mono">WHEN? · DATING</span><span class="plat">Expo</span><span class="led" aria-hidden="true"></span></div>
{indent}      <div class="screen-body screen-body--frame"><img src="break-even/dating.png" alt="When? dating simulation screen" style="display:block;width:100%;height:auto" /></div>
{indent}      <figcaption class="mono">dating domain · same shared failure lifecycle</figcaption>
{indent}    </figure>
{indent}    <figure class="screen screen--phone reveal">
{indent}      <div class="screen-top"><span class="mono">WHEN? · MERCH</span><span class="plat">Expo</span><span class="led" aria-hidden="true"></span></div>
{indent}      <div class="screen-body screen-body--frame"><img src="break-even/merch.png" alt="When? timed merch pop-up screen" style="display:block;width:100%;height:auto" /></div>
{indent}      <figcaption class="mono">timed merch · voucher and redemption workflow</figcaption>
{indent}    </figure>
{indent}  </div>
{indent}</article>

{indent}'''
          path.write_text(text[:article] + card + text[article:], encoding="utf-8")

      - name: Validate and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s break-even/home.png
          test -s break-even/dating.png
          test -s break-even/merch.png
          grep -q 'href="break-even/index.html">Case study</a>' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html break-even/home.png break-even/dating.png break-even/merch.png
          git commit -m "feat: surface When? case study with live screenshots"
          git push
